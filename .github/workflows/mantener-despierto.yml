name: Mantener despierto

# POR QUE EXISTE
# Supabase pausa los proyectos del plan gratuito despues de 7 dias sin
# actividad. Cuando eso pasa, el sitio deja de traer contenido y hay que entrar
# al panel de Supabase a reactivarlo a mano. Ya ocurrio una vez.
#
# Cualquier consulta a la base reinicia ese reloj. Asi que esto entra al sitio
# cada dos dias, lo que dispara una lectura real, y el proyecto no se duerme.
#
# NO hace falta pagar nada: Supabase ofrece el plan Pro para evitar las pausas,
# pero mantener actividad tiene el mismo efecto y es gratis.
#
# GitHub Actions es gratuito en repositorios publicos y trae 2.000 minutos por
# mes en los privados. Esto tarda unos segundos por corrida.
#
# OJO: GitHub desactiva las tareas programadas si el repositorio pasa 60 dias
# sin ningun cambio. Si el proyecto queda quieto mucho tiempo, hay que volver a
# activarla desde la pestana Actions.

on:
  schedule:
    # 09:00 UTC = 06:00 en Argentina, cada dos dias.
    - cron: "0 9 */2 * *"
  # Tambien se puede disparar a mano desde la pestana Actions.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Entrar al sitio (dispara una lectura de la base)
        run: |
          set -e
          SITIO="https://www.cursemosingenieria.com"
          # /campus y una universidad leen de la base al regenerarse.
          for ruta in "/" "/campus" "/novedades"; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITIO$ruta")
            echo "$ruta → $codigo"
            if [ "$codigo" != "200" ]; then
              echo "::error::El sitio respondio $codigo en $ruta"
              exit 1
            fi
          done

      - name: Consultar la base directamente
        # Confirma que la base este despierta, no solo que el sitio responda
        # desde la cache. Si falta la clave, se saltea sin romper.
        if: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          CLAVE: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -e
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$URL/rest/v1/universities?select=id&limit=1" -H "apikey: $CLAVE")
          echo "base de datos → $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::La base respondio $codigo. Puede estar pausada: entra a Supabase y toca Resume project."
            exit 1
          fi
