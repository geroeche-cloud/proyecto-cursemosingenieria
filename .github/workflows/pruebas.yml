name: Pruebas

# Corre en cada push a main y en cada Pull Request. GitHub Actions es gratuito
# para repositorios públicos y trae 2.000 minutos por mes en los privados; esta
# suite tarda ~2 minutos, así que no hay costo real.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Las claves viven a nivel del job para poder preguntar si existen antes de
    # correr las pruebas de navegador (ver el paso "Pruebas...").
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Tipos y estilo no tocan la base: corren siempre, con o sin claves.
      - name: Tipos
        run: npx tsc --noEmit

      - name: Estilo de código
        run: npm run lint

      # Compilar y las pruebas de navegador SÍ necesitan la base: el build
      # pre-renderiza páginas que leen contenido real. Sin claves se saltean en
      # vez de fallar — un CI en rojo por configuración faltante es ruido, no
      # información, y termina enseñando a ignorar los avisos.
      - name: Compilar
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: npm run build

      - name: Instalar navegador de pruebas
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: npx playwright install --with-deps chromium

      - name: Pruebas de los flujos críticos
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: npx playwright test --project=escritorio

      - name: Aviso si faltan las claves
        if: env.NEXT_PUBLIC_SUPABASE_URL == ''
        run: |
          echo "::warning::Solo se verificaron tipos y estilo. Para activar el build y las pruebas, cargá NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY y SUPABASE_SERVICE_ROLE_KEY en Settings > Secrets and variables > Actions."

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-de-pruebas
          path: playwright-report/
          retention-days: 7
